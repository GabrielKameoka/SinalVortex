<main class="login-shell"><section class="login-card" aria-labelledby="login-title"><div class="brand-mark">SV</div><p class="eyebrow">SinalVortex / Console</p><h1 id="login-title">Bem-vindo de volta</h1><p class="muted">Acompanhe a operação de notificações em um só lugar.</p><form [formGroup]="form" (ngSubmit)="submit()" novalidate><label>Tenant ID<input formControlName="tenantId" placeholder="UUID do tenant" autocomplete="organization" /></label><label>E-mail<input formControlName="email" type="email" placeholder="voce@empresa.com" autocomplete="email" /></label><label>Senha<input formControlName="senha" type="password" placeholder="••••••••" autocomplete="current-password" /></label><p class="form-error" *ngIf="error" role="alert">{{ error }}</p><button class="primary-button" type="submit" [disabled]="loading"><span *ngIf="loading" class="spinner"></span>{{ loading ? 'Entrando…' : 'Entrar no painel' }}</button></form></section></main>
